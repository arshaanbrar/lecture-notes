# Render's free plan puts the site to sleep after 15 minutes without visitors, and the next
# visit then takes ~1 minute. Pinging it every 10 minutes keeps it awake. The free plan's
# 750 hours/month cover one service running all month.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://lecture-notes-e1an.onrender.com/healthz
